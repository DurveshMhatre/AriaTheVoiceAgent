[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-agent"
version = "0.1.0"
description = "Aura Skincare Aria text-mode Brain"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.25.1",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.0",
  "pytest-cov==7.0.0",
]
quality = [
  "ruff==0.16.3",
  "mypy==2.4.0",
]
providers = [
  "google-genai==2.30.1",
  "groq==0.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["brain"]
exclude = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["brain*", "providers*"]
