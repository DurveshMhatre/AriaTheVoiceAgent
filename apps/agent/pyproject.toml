[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-agent"
version = "0.1.0"
description = "Aura Skincare Aria text-mode Brain"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.25.1",
  "PyYAML==6.0.3",
  "rfc3339-validator==0.1.4",
  "tzdata==2026.5",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.0",
  "pytest-cov==7.0.0",
]
quality = [
  "ruff==0.16.3",
  "mypy==2.4.0",
  "types-PyYAML==6.0.12.20260906",
  "types-jsonschema==4.26.0.20261006",
]
providers = [
  "google-genai==2.30.1",
  "groq==0.31.0",
  "sarvamai==0.1.36",
]
security = [
  "pip-audit==2.10.1",
]
voice = [
  "livekit-agents==1.8.6",
  "livekit-plugins-sarvam==1.8.6",
  "python-dotenv==1.2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["brain"]
exclude = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["brain*", "providers*", "voice*"]
